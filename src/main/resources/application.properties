spring.application.name=thuvien
# 1. Địa chỉ database (library_db là tên database bạn phải tạo trước trong Postgres)
spring.datasource.url=jdbc:postgresql://localhost:5432/library_db
# 2. User mặc định của Postgres thường là postgres
spring.datasource.username=postgres
# 3. Mật khẩu bạn đặt khi cài Postgres
spring.datasource.password=123456
# 4. Driver
spring.datasource.driver-class-name=org.postgresql.Driver
# Quan trọng nhất: Tự động tạo/cập nhật bảng dựa trên class @Entity của bạn
spring.jpa.hibernate.ddl-auto=update
logging.level.org.springframework.security=DEBUG
# Hiển thị SQL để mình xem Spring nó làm gì với DB
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true